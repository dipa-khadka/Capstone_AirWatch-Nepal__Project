# Fetches live air quality readings once an hour and saves them in the (online) database.
# It runs on GitHub's computers, so no laptop has to stay on.
# Needs these secrets in the repository: Settings > Secrets and variables > Actions
#   WAQI_TOKEN, DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
name: Collect live data
on:
  schedule:
    - cron: "7 * * * *"   # minute 7 of every hour
  workflow_dispatch:       # also lets you start it by hand from the Actions tab
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyMySQL requests python-dotenv
      - run: python backend/collector.py
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: "true"
