<!-- AirWatch Nepal logo: white mountains and wind lines on a blue to purple square. Drawn for this project. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fb8"/>
      <stop offset="1" stop-color="#6a4fb3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- two mountain peaks, the taller one has a snow cap -->
  <path d="M5 52 L21 29 L30 41 L42 21 L59 52 Z" fill="#ffffff"/>
  <path d="M42 21 L48.5 31 L45 29.5 L42 33 L39 29 L36 31 Z" fill="#bcd8f2"/>
  <!-- wind lines blowing above the mountains -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path d="M9 14 H31 a4.5 4.5 0 1 0 -4.5 -4.5"/>
    <path d="M9 21 H20"/>
  </g>
</svg>
